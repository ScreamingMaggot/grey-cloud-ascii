/* =====================================================================

   · 中频全程满格、总能量动态仅 8.9 dB —— 这是一堵音墙，不是叙事曲
   · 高频约在 140~190s 堆到最密、谱质心同步上移 —— 推进靠音色堆积
   · 58 次 0.1~0.3s 的低频塌陷（9~18 dB）—— 墙上唯一的呼吸
   · 215s 后整体坍塌，231s 归零

   来自曲子自己：下面是浓密的块，上面是稀薄的丝。
   ===================================================================== */

const THICK = "·:+=*#▓█";         // 高频堆积：密实成块
const FOG   = THIN;               // 远雾层只用最细的几档：大尺度、暗、不成形
/* ---------- 体积盒：6 层 + 真遮挡 ----------
   上一版 12 层实测是线性相加（3.9%+5.0%+…≈10.8%），没有一层挡住另一层，
   相加还把对比度平均掉了，所以看着只有一层。这版按 Beer-Lambert 累积消光：
   近处云挡住远处，远处只从近处的缝隙里露出来——纵深来自遮挡，不来自层数。
   远处模糊改用低频噪声，不再降采样（step>1 产生的是色块，不是模糊）。
   索引 0 = 最远。 */

  const w=innerWidth,h=innerHeight;

  PXW=cx.measureText("█").width || Math.floor(cellH*0.92)*0.6;
  COLS=Math.max(40,Math.ceil(w/PXW));
  needRainAlloc=true; needLayerAlloc=true;

  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return (hash2(ix,iy,p)*(1-ux)+hash2(ix+1,iy,p)*ux)*(1-uy)
       + (hash2(ix,iy+1,p)*(1-ux)+hash2(ix+1,iy+1,p)*ux)*uy}
function fbm(x,y,p){let s=0,a=.5,n=0;
  for(let i=0;i<4;i++){s+=n2(x,y,p+i*37)*a;n+=a;a*=.5;x*=2.03;y*=2.03}return s/n}

const DEMO_N=CURVES.rms.length;
const at=(a,t)=>a[Math.min(DEMO_N-1,Math.floor(t*2))]/100;
function demoSample(t){
  return {rms:at(CURVES.rms,t),low:at(CURVES.low,t),mid:at(CURVES.mid,t),
          high:at(CURVES.high,t),cent:at(CURVES.cent,t),crack:at(CURVES.crack,t)};

function analyse(t){
  if(!DEMO && freq){
    an.getByteFrequencyData(freq);
    const binHz=SR/FFT;
    for(let r=0;r<ROWS;r++){
      const a=Math.max(1,Math.floor(rowLo[r]/binHz)), b=Math.min(freq.length,Math.ceil(rowHi[r]/binHz));
      let s=0;for(let k=a;k<=b;k++)s+=freq[k];
      bandRow[r]=(s/((b-a+1)*255))||0;
    }
    let lo=0,hi=0,all=0;
    for(let r=0;r<ROWS;r++){all+=bandRow[r];
      if(rowHi[r]<150)lo+=bandRow[r]; if(rowLo[r]>4200)hi+=bandRow[r]}
    for(let r=0;r<ROWS;r++){
      rowPeak[r]=Math.max(bandRow[r],rowPeak[r]*0.9992);
      bandRow[r]=bandRow[r]/rowPeak[r];
    }
    const rawL=all/ROWS;
    levelPeak=Math.max(rawL,levelPeak*0.9992); level=rawL/levelPeak;
    hiPeak=Math.max(hi,hiPeak*0.9992); loPeak=Math.max(lo,loPeak*0.9992);
    const hn=hi/hiPeak, ln=lo/loPeak;
    sharp=hn;                                               // 同 demo：只看高频自身
    lowHist.push(ln);
    if(lowHist.length>90)lowHist.shift();
    const base=lowHist.slice().sort((a,b)=>a-b)[Math.floor(lowHist.length*0.6)]||0.2;
    crack = (ln < base*0.45) ? 1 : Math.max(0,crack-0.06);
    dying = level<0.18 ? Math.min(1,dying+0.02) : 0;
  }else{
    const d=demoSample(t);
    // demo：把整条曲线摊到各行（行=频段），并保留低频塌陷事件
    for(let r=0;r<ROWS;r++){
      const w=r/(ROWS-1);                                  // 0=顶(高频) 1=底(低频)
      // 行=频段，但用连续三角隶属度而非 if/else 阶跃：阶跃会把画面横切成三条
      const [hw,mw,lw]=rowW(w), sw=hw+mw+lw+1e-6;
      const e=(d.high*hw + d.mid*mw + d.low*lw)/sw;
      bandRow[r]=Math.pow(cl(e,0,1),1.05)*(0.86+0.28*(1-w));
    }
    level=d.rms; sharp=d.high;                              // 只看高频自身：拿它和低频比会被塌陷事件骗反
    crack=d.crack;                                        // 实测的低频塌陷事件
    dying = d.rms<0.12 ? Math.min(1,dying+0.012) : 0;
  }
  // 慢包络：高频曲线逐帧剧抖（41,24,38,65,34,61,25,53,46,79…），
  // 用瞬时值表达「越积越厚」会把趋势抖没；包络管积聚，瞬时值管呼吸。
  if(sharpSlow===0) sharpSlow=sharp;                        // 从任意时刻启动都要正确
  else sharpSlow += (sharp-sharpSlow)*0.010;
  // 主旋律声部（分离轨，实测为音调性器乐）：给整体色温打底，越到后段越暖
  const melNow=STEMS.voc[Math.min(STEMS.voc.length-1,Math.floor(t*2))]/100;
  mel += (melNow-mel)*0.05;
  pulseLo=pulseAt(PLO,t); pulseHi=pulseAt(PHI,t);
}

/* ---------- 鼓点 = 云内放电，不是水面波纹 ----------
   形态用递归中点位移：主干从起点走向终点，逐级加入垂直抖动，再在若干节点长出分叉。
   三类鼓的差别落在几何上（长度/走向/分叉/寿命），不是颜色上：
     KICK  从云底向上贯穿，最长最直、最粗、寿命最长（实测质心 405Hz，最沉）
     SNARE 斜向中等距离，分叉最多（实测 amp 0.52 居首，最"炸"）
     HAT   短小火花，细、快、几乎不分叉（实测 1.63/s 最密，单个最弱）
   辉光用三层描边叠加伪造——filter 会把帧率打回 0.3。 */

function boltPts(x0,y0,x1,y1,disp,levels){
  let p=[[x0,y0],[x1,y1]];
  for(let l=0;l<levels;l++){
    const out=[];
    for(let i=0;i<p.length-1;i++){
      const a=p[i],b=p[i+1];
      const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
      const off=(Math.random()*2-1)*disp/(l*0.9+1);
      out.push(a,[ (a[0]+b[0])/2 - dy/len*off, (a[1]+b[1])/2 + dx/len*off ]);
    }
    out.push(p[p.length-1]); p=out;
  }
  return p;
}

  }
  const pts=boltPts(x0,y0,x1,y1,disp,5);
  const br=[];
  for(let f=0;f<forks;f++){
    const i=2+Math.floor(Math.random()*(pts.length-4));
    const [bx,by]=pts[i];
    const tx=bx+(Math.random()*2-1)*disp*2.6, ty=by+(c===0?-1:1)*H*(0.03+Math.random()*0.09);
    br.push(boltPts(bx,by,tx,ty,disp*0.55,4));
  }
  // 光心与照明半径：闪电从内部照亮附近的云（也是纵深线索）
  let mx=0,my=0; for(const q of pts){mx+=q[0];my+=q[1]} mx/=pts.length; my/=pts.length;
  bolts.push({t:tNow,pts,br,width,life,cx:mx,cy:my,
              rad:Math.hypot(x1-x0,y1-y0)*0.72+50});
  if(bolts.length>12) bolts.shift();
}
let oi=0, prevT=-1;
function pumpOnsets(t){
  if(t<prevT-0.25){ oi=0; bolts.length=0; }                 // 重播或跳时刻
  prevT=t;
  while(oi<STEMS.onT.length && STEMS.onT[oi]*ONSET_GAP<=t){
    const a=STEMS.onA[oi]/100, c=STEMS.cls[oi];
    // 门槛按类分开：hat 密而弱（1.63/s）要更低门槛才看得见，kick 稀而重，每记都该响
    if(a>[0.10,0.16,0.22][c]) spawnBolt(c,a);
    oi++;
  }
}
/* ---------- 雨：按层透视分配 ----------
   每滴按 rainDens 权重抽一个深度层：远处更密、更小、更慢、更暗；近处反之。
   绘制时按字符大小归成 3 组，避免 12 层各刷一遍行缓冲（那会把 fillText 数量推到 744）。 */
const RAIN_MAX=580;   // 雨在画面外也生成（见 updateRain 的 X0/X1），上限相应放大
const rx=new Float32Array(RAIN_MAX), ry=new Float32Array(RAIN_MAX),
      rv=new Float32Array(RAIN_MAX), rl=new Uint8Array(RAIN_MAX);
const RAIN_CUM=(()=>{ let s=0; for(let i=0;i<NL;i++) s+=DEPTHS[i].rainDens;
  const out=[]; let a=0;
  for(let i=0;i<NL;i++){ a+=DEPTHS[i].rainDens/s; out.push(a); } return out; })();
function pickLayer(z){ for(let i=0;i<NL;i++) if(z<=RAIN_CUM[i]) return i; return NL-1; }
const RAIN_CH=[[".","'"],[",","`"],["|","/","\\"]];        // 按 rainSz 分三档大小
const RAIN_OP=["0.16","0.23","0.31"];   // 远层雨最密，压太暗就等于看不见，透视白做
let rainN=0, rainBuf=null, base=null;
function allocRain(){
  base=new Float32Array(COLS);
  rainBuf=[0,1,2].map(()=>{ const rows=[];
    for(let r=0;r<ROWS;r++) rows.push(new Array(COLS).fill(" "));
    return rows; });
}
/* 风必须是慢变量。之前用 pulseLo 的符号定摆向，而那是 4Hz 的低频泵，
   等于让风每秒换四次向，雨就在画面里左摇右晃。 */
function windAt(t){ return Math.sin(t*0.115)*0.55+Math.sin(t*0.037+1.7)*0.45; }
/* 雨在画面外 18% 也生成。雨幕是前景、视差位移最大，只在画内生成的话，
   鼠标一转身某一侧就露出没有雨的空白边带。 */
const RAIN_PAD=0.18;
function rainX(){ return (Math.random()*(1+2*RAIN_PAD)-RAIN_PAD)*cv.width }
function baseAt(px){ return base[cl((px/PXW)|0,0,COLS-1)] }
function updateRain(dt){
  if(!base) return;
  const want=Math.min(RAIN_MAX, Math.floor((40+level*360)*(1+2*RAIN_PAD)));   // 音量只决定密度
  while(rainN<want){
    const px=rainX(), z=Math.random(), cb=baseAt(px);
    rx[rainN]=px; rv[rainN]=z; rl[rainN]=pickLayer(z);
    ry[rainN]=cb*cv.height + Math.random()*(1-cb)*cv.height*0.4;
    rainN++;
  }
  if(want<rainN) rainN=want;
  const fall=cv.height*1.41, wind=windAt(tNow);              // 恒定基准，层间再乘 rainSpd
  const XLO=-RAIN_PAD*cv.width-20, XHI=(1+RAIN_PAD)*cv.width+20;
  for(let i=0;i<rainN;i++){
    const D=DEPTHS[rl[i]];
    ry[i]+= D.rainSpd*(0.75+rv[i]*0.4)*fall*dt;
    rx[i]+= wind*D.rainSpd*fall*0.11*dt;
    if(ry[i]>cv.height+20 || rx[i]<XLO || rx[i]>XHI){
      const px=rainX(), z=Math.random(), cb=baseAt(px);
      rx[i]=px; ry[i]=cb*cv.height+Math.random()*8;
      rv[i]=z; rl[i]=pickLayer(z);
    }
  }
}
function drawRain(){
  if(!rainN||!rainBuf||!base) return;
  for(let g=0;g<3;g++){ const rows=rainBuf[g];
    for(let r=0;r<ROWS;r++) rows[r].fill(" "); }
  const wind=windAt(tNow), slant=Math.abs(wind);
  for(let i=0;i<rainN;i++){
    const c=(rx[i]/PXW)|0, r=(ry[i]/cellH)|0;
    if(c<0||c>=COLS||r<0||r>=ROWS) continue;
    const D=DEPTHS[rl[i]];
    // 云内也留一部分雨（virga：未落地即蒸发）——否则云体内部是空的，缺少质感。
    // 云内的雨一律走最细档，读起来是"雨幕"而不是"雨丝"
    const inCloud = ry[i] < base[c]*cv.height;
    if(inCloud && rv[i]>0.42) continue;
    const g = inCloud ? 0 : D.rainSz;
    const set=RAIN_CH[g];
    let ch;
    if(g===0) ch = slant>0.55 ? "." : "'";
    else if(g===1) ch = slant>0.62 ? (wind>0?"/":"\\") : "`";
    else ch = slant>0.80 ? (wind>0?"/":"\\") : "|";
    rainBuf[g][r][c]=ch;
    if(tMask && tMask[r*COLS+c]) tHit[r*COLS+c]+=1;   // 雨点把字打亮
    if(g===2 && r>0 && rainBuf[2][r-1][c]===" ") rainBuf[2][r-1][c]="'";  // 近雨残影
  }
  for(let g=0;g<3;g++){
    cx.fillStyle=`rgba(${g===2?"206,212,222":(g===1?"178,185,197":"150,157,170")},${RAIN_OP[g]})`;
    const rows=rainBuf[g];
    for(let r=0;r<ROWS;r++) cx.fillText(rows[r].join(""),0,(r+0.5)*cellH);
  }
}

/* ---------- 云底：体积感与雨的起点都靠它 ----------
   每列一个云底高度：低频把云压低（音墙越沉、云越低），大尺度噪声给云底起伏。
   有了这个底面，「云内不下雨」「闪电穿出云底」「云底更厚更暗」才同时成立——
   之前云铺满全画面，没有底面，体积感自然出不来。 */
let baseMean=0.45;
function updateBase(){
  if(!base) return;
  const lowE=(bandRow[ROWS-1]+bandRow[Math.floor(ROWS*0.82)])*0.5;
  baseMean=cl(0.575+lowE*0.13+sharpSlow*0.04, 0.3, 0.82);
  for(let c=0;c<COLS;c++){
    const wob=fbm((c+0.5)*PXW*0.0021 - phase*0.55, 3.7, 77);
    base[c]=cl(baseMean + (wob-0.5)*0.30, 0.24, 0.88);
  }
}

/* ---------- 本底雾：给盒子一个底面和后壁 ----------
   纵深不是靠层数堆出来的，而是靠边界：近地雾更浓（盒底）、向上渐稀（盒顶），
   整盒再蒙一层随高度变糊的底色（后壁）。缺了这两层，云就像浮在黑纸上。 */
function drawHaze(){
  const st=3, fill="   ";
  for(let r=0;r<ROWS;r++){
    const ypx=(r+0.5)*cellH, yv=ypx/cv.height;
    const gnd=cl((yv-0.58)/0.42,0,1);                  // 越接近地面雾越浓
    let line="", any=false;
    for(let c=0;c<COLS;c+=st){
      const xpx=(c+st*0.5)*PXW;
      const nx=xpx*0.00085, ny=ypx*0.0021-phase*0.16;
      const v=fbm(nx,ny,57)*0.68+fbm(nx*2.4,ny*2.4-phase*0.3,71)*0.32;
      const cov=0.12+gnd*0.50+level*0.06;
      if(v < 1-cov){ line+=fill; continue }
      const idx=Math.min(2,Math.floor((v-(1-cov))*8));
      const ch=FOG[idx]; for(let q=0;q<st;q++) line+=ch;
      any=true;
    }
    if(!any) continue;
    cx.fillStyle=`rgba(148,155,169,${(0.045+gnd*0.115).toFixed(3)})`;
    cx.fillText(line,0,ypx);
  }
}

/* ---------- 闪电：必须是字符，不是线条 ----------
   连续曲线和离散字符网格是两种语法，混在一张图里会出戏。所以闪电走的是
   「格子路径」：每步只在字符网格里落一个符号，符号按斜率取 | / \ ─，
   整条通道因此保持 ASCII 质感。 */
function boltCharAt(pts,i){
  const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  if(Math.abs(dx)<0.5 && Math.abs(dy)<0.5) return 0;
  const s=dy/dx;
  if(Math.abs(dx)<Math.abs(dy)*0.6) return 0;
  if(s>0.6) return 1; if(s<-0.6) return 2;
  return 3;
}
const BCH=["|","/","\\","-"];
const GCH=["*","+","·"];                 // 光晕字符：半径越大越稀越淡
/* 光晕逐格 fillText 太贵（一条闪电上千次调用），改成按行打包成字符串、
   每行一次 fillText——和雨幕同一套做法，所以半径长到 3 格也不掉帧。 */
let BW=0,BCORE=null,BGLOW=null,BVIS=new Uint8Array(ROWS),BROWS=[];
function allocBoltBuf(){
  BW=COLS+10; BCORE=new Uint8Array(BW*ROWS); BGLOW=new Uint8Array(BW*ROWS);
}
function drawBolts(t){
  if(!BCORE || BW!==COLS+10) allocBoltBuf();
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i], age=t-b.t;
    if(age>b.life){ bolts.splice(i,1); continue; }
    const k=1-age/b.life, grow=age/b.life;
    // 回击式抖动：真实闪电不是一次平滑熄灭，而是跳着灭
    const flick=0.5+0.5*Math.abs(Math.sin(age*44+i*2.3));
    const al=Math.pow(k,1.3)*flick;
    /* 余辉外扩：通道熄灭时，光不是原地变暗，而是从通道向两侧推开一圈壳，
       同时变稀变淡。所以半径随 grow 从 1 格长到 3 格，字符从 * 降到 ·。 */
    const rad = grow<0.28?1:(grow<0.60?2:3), gidx=grow<0.28?0:(grow<0.60?1:2);
    BCORE.fill(0); BGLOW.fill(0); BVIS.fill(0); BROWS.length=0;
    const step=Math.min(PXW,cellH)*0.85;
    for(const one of [b.pts,...b.br]){
      for(let s=0;s+1<one.length;s++){
        const x0=one[s][0],y0=one[s][1],x1=one[s+1][0],y1=one[s+1][1];
        const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/step));
        const ch=boltCharAt(one,s);
        for(let q=0;q<n;q++){
          const c=Math.floor((x0+(x1-x0)*q/n)/PXW)+5, r=Math.floor((y0+(y1-y0)*q/n)/cellH);
          if(r<0||r>=ROWS||c<1||c>=BW-1) continue;
          BCORE[r*BW+c]=ch+1;
          for(let dy=-rad;dy<=rad;dy++){
            const rr=r+dy; if(rr<0||rr>=ROWS) continue;
            for(let dx=-rad;dx<=rad;dx++){
              const cc=c+dx; if(cc<0||cc>=BW) continue;
              const d=Math.max(Math.abs(dx),Math.abs(dy));
              if(d===0) continue;
              const o=rr*BW+cc;
              if(d===rad) BGLOW[o]=gidx+1;
              else if(!BGLOW[o]) BGLOW[o]=gidx+1;
            }
          }
          if(!BVIS[r]){ BVIS[r]=1; BROWS.push(r) }
        }
      }
    }
    const hot =`rgba(232,242,255,${(al*0.95).toFixed(3)})`;   // 核心：蓝白，高温通道
    const halo=`rgba(250,222,156,${(al*0.32*(1.15-grow*0.5)).toFixed(3)})`;
    for(const r of BROWS){
      const off= r*BW;
      let cs="", gs="", anyC=false, anyG=false;
      for(let c=0;c<BW;c++){
        const v=BCORE[off+c], w=BGLOW[off+c];
        cs += v ? BCH[v-1] : " ";
        if(w){ gs+=GCH[w-1]; anyG=true } else gs+=" ";
        if(v) anyC=true;
      }
      const ypx=(r+0.5)*cellH;
      cx.fillStyle=halo;
      if(anyG) cx.fillText(gs,-5*PXW,ypx);              // 光晕先铺，核心压在它上面
      if(anyC){ cx.fillStyle=hot; cx.fillText(cs,-5*PXW,ypx) }
      BCORE.fill(0,off,off+BW); BGLOW.fill(0,off,off+BW);
    }
  }
}

/* ---------- 位移场：势场旋度（curl）----------
   用 ψ 的旋度做速度天然无散，云会翻滚涡旋而不是整体平移——「滚动感」的来源。
   逐格求旋度要 4 次 fbm 太贵，故在 26x15 粗网格上算一次，格子层双线性插值。 */
const GW=26, GH=15, FDX=new Float32Array(GW*GH), FDY=new Float32Array(GW*GH);
function updateFlow(t){
  const e=0.28;
  for(let j=0;j<GH;j++){
    const y=j/GH*3.0 - t*0.05;
    for(let i=0;i<GW;i++){
      const x=i/GW*4.6, k=j*GW+i;
      FDX[k]=(fbm(x,y+e,31)-fbm(x,y-e,31))/(2*e);
      FDY[k]=-(fbm(x+e,y,31)-fbm(x-e,y,31))/(2*e);
    }
  }
}
const _f=[0,0];
function flowAt(u,v,spd){
  const gx=cl(u,0,1)*(GW-1), gy=cl(v,0,1)*(GH-1);
  const i0=gx|0, j0=gy|0, i1=Math.min(GW-1,i0+1), j1=Math.min(GH-1,j0+1);
  const tx=gx-i0, ty=gy-j0, w00=(1-tx)*(1-ty), w10=tx*(1-ty), w01=(1-tx)*ty, w11=tx*ty;
  const a=j0*GW, b=j1*GW;
  _f[0]=(FDX[a+i0]*w00+FDX[a+i1]*w10+FDX[b+i0]*w01+FDX[b+i1]*w11)*spd;
  _f[1]=(FDY[a+i0]*w00+FDY[a+i1]*w10+FDY[b+i0]*w01+FDY[b+i1]*w11)*spd;
}
/* ---------- 闪电照明：沿通道，不是大圆 ----------
   原先以闪电的几何中心为圆心、按整条长度算半径 -> kick 那道从云底打到画面底，
   半径 ~340px，把远离通道的云也判成"被照亮"。中段画面密看不出来，
   首尾背景一暗，那块暖色就成了突兀的一片。
   改成把光泼溅到 28x16 的粗网格上再双线性采样：保留通道的细长形状，
   每帧成本也只有 点数x9 次加法。 */
const LW=28, LH=16, LMAP=new Float32Array(LW*LH);
function stampLightMap(t){
  LMAP.fill(0);
  const cw=cv.width/LW, ch=cv.height/LH;
  for(let i=0;i<bolts.length;i++){
    const b=bolts[i], age=t-b.t;
    if(age>b.life) continue;
    const k=1-age/b.life, grow=age/b.life;
    /* 照明贴着通道形状走，外扩幅度要小：这张图是 28x16 的粗网格，一格就是 68px，
       半径给到 3 格再双线性一插，就糊成一个 220px 的圆盘（实测右上角那坨暖白）。
       用 max 而不是累加——累加会让通道两侧一路饱和成实心块，字符阶梯全废。 */
    const rad=0.75+grow*0.75, inten=k*k*k;
    const paths=[b.pts].concat(b.br);
    for(let pi=0;pi<paths.length;pi++){
      const one=paths[pi];
      for(let s=0;s+1<one.length;s++){
        const x0=one[s][0],y0=one[s][1],x1=one[s+1][0],y1=one[s+1][1];
        const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/(Math.max(cw,ch)*0.55)));
        for(let q=0;q<n;q++){
          const gx=(x0+(x1-x0)*q/n)/cw, gy=(y0+(y1-y0)*q/n)/ch;
          const ix=Math.floor(gx), iy=Math.floor(gy), R=Math.ceil(rad);
          for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
            const ii=iy+dy, jj=ix+dx;
            if(ii<0||ii>=LH||jj<0||jj>=LW) continue;
            const d=Math.hypot(jj-gx,ii-gy);
            if(d>rad) continue;
            const o=ii*LW+jj, v=inten*(1-d/rad);
            if(v>LMAP[o]) LMAP[o]=v;
          }
        }
      }
    }
  }
}
function lightAt(xpx,ypx){
  const u=cl(xpx/cv.width,0,1)*(LW-1), v=cl(ypx/cv.height,0,1)*(LH-1);
  const i0=u|0, j0=v|0, i1=Math.min(LW-1,i0+1), j1=Math.min(LH-1,j0+1);
  const tu=u-i0, tv=v-j0;
  return (LMAP[j0*LW+i0]*(1-tu)+LMAP[j0*LW+i1]*tu)*(1-tv)
       + (LMAP[j1*LW+i0]*(1-tu)+LMAP[j1*LW+i1]*tu)*tv;
}

/* ---------- 标题：GREY CLOUD 藏在雨幕里 ----------
   不直接印出来，而是让雨点替它显形：底衬只留极淡轮廓，被雨丝击中的字格才变亮，
   所以字是"若隐若现"的，且与雨是真实交互（雨越大字越清楚），不是贴上去的装饰。 */
/* 5x7 点阵，每行是 5 bit（bit4=最左列）。之前误写成 4-bit 值，
   而渲染按 5 列取位 -> 最左列恒空，每个字都缺一竖：G 因此看着像 6。
   G 的横杠用 10111（从中间起），刻意不碰左边那根竖。 */
const FONT={
  G:[14,17,16,23,17,17,14], R:[30,17,17,30,20,18,17], E:[31,16,16,30,16,16,31],
  Y:[17,17,10,4,4,4,4],     C:[14,17,16,16,16,17,14], L:[16,16,16,16,16,16,31],
  O:[14,17,17,17,17,17,14], U:[17,17,17,17,17,17,14], D:[30,17,17,17,17,17,30],
  " ":[0,0,0,0,0,0,0]
};
const WORD="GREY CLOUD";
let tMask=null, tRows=[], tScale=2, tHit=null;
function buildTitle(){
  const per=6;                                   // 5 列字宽 + 1 列间距
  const units=WORD.length*per-1;
  tScale=Math.max(2,Math.min(4,Math.floor(COLS*0.86/units)));   // 留 7% 边距给视差位移
  const w=units*tScale, h=7*tScale;
  const left=Math.floor((COLS-w)/2);
  // 位置锚在云底以下的雨幕区，用固定参考值，免得随云底起伏而漂移
  const ref=0.575;
  let top=Math.floor(ref*ROWS + (ROWS-ref*ROWS-h)*0.34);
  top=cl(top,0,ROWS-h-1);
  tMask=new Uint8Array(COLS*ROWS); tHit=new Float32Array(COLS*ROWS); tRows=[];
  for(let r=0;r<h;r++) tRows.push(top+r);
  let ox=left;
  for(const ch of WORD){
    const bm=FONT[ch]||FONT[" "];
    for(let gy=0;gy<7;gy++)for(let gx=0;gx<5;gx++){
      if(!((bm[gy]>>(4-gx))&1)) continue;
      for(let sy=0;sy<tScale;sy++)for(let sx=0;sx<tScale;sx++){
        const rr=top+gy*tScale+sy, cc=ox+gx*tScale+sx;
        if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS) tMask[rr*COLS+cc]=1;
      }
    }
    ox+=per*tScale;
  }
}
function drawTitle(){
  if(!tMask) return;
  const pulse=0.55+0.45*Math.sin(tNow*0.23);     // 呼吸：字自己也会隐下去
  for(const r of tRows){
    let base="",lit="",nB=false,nL=false;
    const ypx=(r+0.5)*cellH;
    for(let c=0;c<COLS;c++){
      const i=r*COLS+c;
      if(!tMask[i]){ base+=" "; lit+=" "; continue }
      const h=tHit[i]; tHit[i]=h*0.90;           // 帧间衰减：雨停字就淡回去
      base+="░"; nB=true;
      if(h>0.30){ lit+= h>1.7?"▓":(h>0.85?"#":"*"); nL=true } else lit+=" ";
    }
    if(nB){ cx.fillStyle=`rgba(214,222,236,${(0.30+0.13*pulse).toFixed(3)})`;
            cx.fillText(base,0,ypx); }                     // 轮廓常驻，只随呼吸明暗
    if(nL){ cx.fillStyle=`rgba(238,244,252,${(0.56+0.26*pulse).toFixed(3)})`;
            cx.fillText(lit,0,ypx); }                      // 雨点打到处更亮
  }
}

/* ---------- 分层离屏渲染 ----------
   每层一张离屏画布：主画布每帧只做 NL 次 drawImage，文本栅格化只在重算帧发生。
   远处层同时做行抽稀（step 行只算一次，其余复用），计算量按 step² 下降。 */
let ACC=null;
function allocLayers(){
  ACC=new Float32Array(COLS*ROWS);
  for(const L of DEPTHS){
    if(!L.cv){ L.cv=document.createElement("canvas"); L.g=L.cv.getContext("2d"); }
    L.cv.width=Math.round(cv.width*(1+OS*2)); L.cv.height=Math.round(cv.height*(1+OS*2));
    L.ox=(L.cv.width-cv.width)/2; L.oy=(L.cv.height-cv.height)/2;
    L.g.font=cx.font; L.g.textBaseline="middle"; L.g.textAlign="left";
    L.tick=0; L.dirty=true;
  }
}
function renderLayer(L, covBase, ramp, gray){
  const g=L.g, st=L.step, fill=" ".repeat(st);
  // 必须清整张离屏画布：它比视口宽 2*OS，只清视口大小会在右侧和底部
  // 留下永不擦除的死区，旧帧越叠越亮，积成一条硬边亮带（实测右下角那坨暖色就是这么来的）
  g.clearRect(0,0,L.cv.width,L.cv.height);
  let cLine=null,cC=null,cL=null,cF="",cFC="",cFL="";
  for(let r=0;r<ROWS;r++){
    const ypx=(r+0.5)*cellH;
    if(st>1 && (r%st)!==0){                            // 行抽稀：复用上一行
      if(cLine){ g.fillStyle=cF;  g.fillText(cLine,L.ox,L.oy+ypx); }
      if(cC){    g.fillStyle=cFC; g.fillText(cC,L.ox,L.oy+ypx); }
      if(cL){    g.fillStyle=cFL; g.fillText(cL,L.ox,L.oy+ypx); }
      continue;
    }
    const w=r/(ROWS-1), yv=ypx/cv.height;
    const [hw,mw,lw]=rowW(w), e=bandRow[r];
    const pu=(lw*pulseLo+hw*pulseHi)/(lw+hw+1e-6)*0.055;
    const crackHere = !L.fog && crack>0.30 && lw>0.25;
    // 越接近云底越暗（云底是阴影面）——体积感的主要线索
    const vert=cl(yv/baseMean,0,1);
    // 响度对各层亮度都要有作用，但幅度按距离衰减：远处只是"背景在呼吸"，
    // 近处才大幅明暗。各层摆幅不一致本身就是纵深线索，全层同幅摆动=一层平光。
    const bright=(0.06+L.br*(0.55+e*0.75)+level*(0.05+0.34*L.lit))*(0.40+0.60*(1-vert*0.84));
    let line="",hiC="",hiL="",any=false,nC=0,nL=0;
    for(let c=0;c<COLS;c+=st){
      const xpx=(c+st*0.5)*PXW;
      const cb=base[c];
      // 云底由消光决定，不是硬边界：cb 只是过渡中心线，每格按距云底的相对深度
      // 乘一段 smoothstep 消光。过渡带随深度层变宽——远处的云底本来就更糊。
      // 云底不是断崖：消光继续向下侵入雨幕行程的 67% 才归零，
      // 所以云是"渐渐变成雨幕"，而不是底下硬擦出一片净空。
      const INTRUDE=0.67;
      let env;
      if(yv<=cb){
        const depth=(cb-yv)/Math.max(cb,0.05);
        env=cl(0.5+depth/(0.07+st*0.062),0,1); env=env*env*(3-2*env);
      }else{
        const below=(yv-cb)/Math.max(1-cb,0.02)/INTRUDE;      // 0=云底 1=侵入到底
        env=below>=1?0:Math.pow(1-below,1.9)*0.52;
      }
      if(env<0.02){line+=fill;hiC+=fill;hiL+=fill;continue}
      const above=cl(1-yv/Math.max(cb,0.03),0,1);            // 1=云顶 0=云底
      flowAt(xpx/cv.width, yv, 1);
      const nx=(xpx+_f[0]*L.flow)*L.sx, ny=(ypx+_f[1]*L.flow)*L.sy;
      const lig=lightAt(xpx,ypx);
      const cut=0.60-level*0.09-sharpSlow*0.11-e*0.10-pu;
      // blob 管「哪里有云」（大尺度、慢），tex 管「云内多厚」（小尺度、快）
      const blob=fbm(nx*0.45,ny*0.45-phase*1.0*L.spd,3);
      const s0=blob*0.60+fbm(nx*1.20,ny*1.20-phase*2.7*L.spd,11)*0.40;
      const gg=cl((s0-0.5)*2.2+0.5,0,1);                 // 拉宽，否则字符阶梯用不满
      // 消光取「超过覆盖线的量」，连续而非二值——二值阈值正是闪烁的来源
      // 消光量直接挂距离：近处云是主体（实）、远处只是背景雾（虚），差 4 倍。
      // 之前各层密度几乎一样，谁都挡不住谁，遮挡关系就白做了。
      const dens=cl((gg-cut)*3.0,0,1)*env*(0.18+L.near*1.25);
      const gi=r*COLS+c;
      const T=Math.exp(-ACC[gi]);                        // 更近的云已经挡掉多少
      ACC[gi]+=dens*L.sigma;                             // 累加消光，留给更远的层
      const show=dens*T;
      if(show<0.055 || (dying>0 && Math.random()<dying*0.04)){line+=fill;hiC+=fill;hiL+=fill;continue}
      if(crackHere){
        const hole=fbm(nx*0.7+7,ny*0.7-phase*1.1,23);
        if(hole>0.60-crack*0.14){                        // 裂开处泄出天光
          for(let q=0;q<st;q++){line+=" ";hiC+="█"}
          hiL+=fill; nC+=st; any=true; continue;
        }
      }
      // 厚度由「可见密度」决定：被挡得狠的地方自然变细，遮挡因此看得见。
      // 闪电照明几乎不参与厚度（只 0.6）：给到 2.4 会把晴空里的细字符一路顶成 █,
      // 于是"被照亮"糊成一块实心奶油色，反而看不出通道在哪。
      let idx=Math.min(7,Math.floor(show*6.2+e*0.9+lig*0.6+(1-above)*2.2));
      if(L.fog) idx=Math.min(idx,2);                     // 雾只用最细的字符
      const ch=L.fog?FOG[idx]:ramp[idx];
      for(let q=0;q<st;q++) line+=ch;
      any=true;
      if(!L.fog && lig>0.62){ for(let q=0;q<st;q++) hiL+=ch; hiC+=fill; nL+=st }
      else { hiC+=fill; hiL+=fill }
    }
    cF=`${gray},${Math.min(0.92,bright).toFixed(3)})`;
    cFC=`rgba(248,230,188,${Math.min(0.9,bright+0.40).toFixed(3)})`;
    cFL=`rgba(240,236,220,${Math.min(0.95,bright+0.44).toFixed(3)})`;
    cLine=any?line:null; cC=nC?hiC:null; cL=nL?hiL:null;
    if(any){ g.fillStyle=cF;  g.fillText(line,L.ox,L.oy+ypx); }
    if(nC){  g.fillStyle=cFC; g.fillText(hiC,L.ox,L.oy+ypx); }        // 裂缝：金色天光
    if(nL){  g.fillStyle=cFL; g.fillText(hiL,L.ox,L.oy+ypx); }        // 闪电照亮：散射偏暖白
  }
}

/* 整盒一次算完：从近到远累积消光，每层渲染时读到的 ACC 就是「前面挡了多少」。
   遮挡跨层，所以不能各层按自己周期独立重算——整盒 2 帧一次，中间帧只做合成。 */
let volTick=0, volDirty=true;
function composeVolume(covBase, ramp, gray){
  ACC.fill(0);
  for(let li=NL-1; li>=0; li--) renderLayer(DEPTHS[li], covBase, ramp, gray);
}

/* ---------- 渲染 ---------- */
let last=performance.now(), phase=0;
function frame(now){
  const dt=Math.min(0.08,(now-last)/1000); last=now;
  // 音频在播就跟着它走，否则自增（点击前的预热画面）
  if(audio && !audio.paused && isFinite(audio.currentTime)) tNow=audio.currentTime;
  else tNow+=dt;
  // 脉冲主要体现为「涌」：泵让云忽快忽慢地推过来，而不是让整幅明暗闪
  sx += (mx-sx)*0.055;                             // 缓动跟随，避免生硬
  phase += dt*(0.05+level*0.07+Math.abs(pulseLo)*0.34+Math.abs(pulseHi)*0.10);
  analyse(tNow);
  pumpOnsets(tNow);
  if(needRainAlloc){ allocRain(); needRainAlloc=false; }
  updateFlow(tNow);
  stampLightMap(tNow);                                         // 照明图要先于云层
  updateBase();                                              // 云底要在雨之前算好
  updateRain(dt);

  // 余辉：不擦干净，让墙有黏滞感
  cx.fillStyle=`rgba(8,9,11,${0.30+dying*0.22})`;
  cx.fillRect(0,0,cv.width,cv.height);

  const ramp=[];                                            // 细碎 <-> 密实
  for(let i=0;i<8;i++){
    const ti=Math.min(THIN.length-1,Math.round(i/7*(THIN.length-1)));
    const ki=Math.min(THICK.length-1,Math.round(i/7*(THICK.length-1)));
    ramp.push(sharp<0.52 ? THIN.charAt(ti) : THICK.charAt(ki));
  }
  // 云与雨共用顶部 DEPTHS 那条深度轴：视差、亮度、尺度、雨速同源于一个 z，距离才成立。
  // 雾层每 2x2 格算一次，省下近一半开销。
  // 云要靠暗部成形：留足黑，否则铺满就只剩字符噪点
  const covBase=0.020+level*0.055+sharpSlow*0.085+mel*0.025;
  const gray="rgba(176,182,193";
  cx.save(); parallax(0.06); drawHaze(); cx.restore();            // 盒子里的空气：最远，几乎不动

  // 每层一张离屏画布：12 层若每帧都往主画布刷 fillText（约 744 次/帧），
  // 光文本栅格化就把预算吃光（实测 13fps）。改成近处每帧重算、远处按周期重算，
  // 主画布每帧只做 NL 次 drawImage。
  if(needLayerAlloc){ allocLayers(); buildTitle(); needLayerAlloc=false; volDirty=true; }
  if(volDirty || ++volTick>=2){ volTick=0; volDirty=false; composeVolume(covBase, ramp, gray); }
  for(let li=0;li<NL;li++){                          // 远端先画，近处盖上去
    const L=DEPTHS[li];
    cx.save(); parallax(L.near);
    cx.drawImage(L.cv,-L.ox,-L.oy);
    cx.restore();
  }
  cx.save(); parallax(1.00); drawRain(); cx.restore();            // 雨在云前，位移最大
  cx.save(); parallax(0.80); drawTitle(); cx.restore();           // 字在雨里，被雨点显形
  cx.save(); parallax(1.06); drawBolts(tNow); cx.restore();       // 闪电通道画在最前
  requestAnimationFrame(frame);
}

/* ---------- 启动 ----------
   时序以音频为准：CURVES 是从这首曲子实测烘焙的，所以即便 file:// 下
   WebAudio 分析被 CORS 拦掉，画面仍与音乐严格同步。实时分析只是可选增强
   （?live=1），换别的曲子时才需要。 */
const LIVE=new URLSearchParams(location.search).has("live");
document.getElementById("start").addEventListener("click",async function(){
  this.classList.add("hide");
  audio=document.getElementById("a");
  if(LIVE){
    try{
      actx=new (window.AudioContext||window.webkitAudioContext)();
      const s=actx.createMediaElementSource(audio);
      an=actx.createAnalyser(); an.fftSize=FFT; an.smoothingTimeConstant=0.80;
      s.connect(an); an.connect(actx.destination);
      freq=new Uint8Array(an.frequencyBinCount);
    }catch(e){/* 被拦则继续用实测曲线驱动 */}
  }
  audio.currentTime=0; await audio.play().catch(()=>{});
});
if(DEMO) document.getElementById("start").classList.add("hide");  // 逐时刻验收/录屏用
requestAnimationFrame(frame);                                      // 渲染循环无条件启动
</script>
</body>
</html>
