/* =====================================================================
   这一版要解决的是上一版留下的问题：那 6 层是**无界的同分布 2D 噪声**，
   每层都铺满整幅，没有任何轮廓边。视差位移量测下来是成立的（最远 24px、
   最近 207px，与设计值吻合），但立体感还是出不来——因为位移要有东西被移，
   眼睛得能在层间找到同一个对象，而一片统计同分布的噪声里没有"同一个对象"。

   所以这里把云改成 3D 空间里的离散团块：
     · 每个团块有真实的 (x,y,z)、半径、消光截面
     · 针孔投影，近大远小是真的算出来的，不是配的常数
     · 按 z 由近及远泼溅，逐格维护累积消光 τ，可见密度 = d·e^(-τ)
       ——遮挡因此是几何的结果，轮廓边自然出现
   相机只绕竖直轴转（偏航）。俯仰不做：那会把"画面纵轴=频率"这条主映射甩歪。

   音色的脉冲性质这次落在**团块**上：从实测鼓点起始按 k-means 的三类分别合成
   指数衰减包络（kick 长、snare 中、hat 短），每个团块归属一类，该类一响它
   就鼓胀变亮。上一版脉冲只能整体调制一个阈值，因为根本没有可分立的对象。
   ===================================================================== */

/* ---------- 噪声：第三维必须插值 ----------
   上一版踩过：p 直接喂给整数哈希（p*BIG|0），相位动一点点整个场就重新随机一次。
   大尺度项在 1080px 上只跨约 4 个格点，重随机会让全局覆盖率跳变。 */
function hash2(ix,iy,p){let h=(ix*374761393+iy*668265263+p*2246822519)|0;
  h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967295}
function n2(x,y,p){const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  return (hash2(ix,iy,p)*(1-ux)+hash2(ix+1,iy,p)*ux)*(1-uy)
       + (hash2(ix,iy+1,p)*(1-ux)+hash2(ix+1,iy+1,p)*ux)*uy}
function n2s(x,y,p){const iz=Math.floor(p),fz=p-iz,u=fz*fz*(3-2*fz);
  return n2(x,y,iz)*(1-u)+n2(x,y,iz+1)*u}
function fbm(x,y,p){let s=0,a=.5,n=0;
  for(let i=0;i<4;i++){s+=n2s(x,y,p+i*37)*a;n+=a;a*=.5;x*=2.03;y*=2.03}return s/n}

/* ---------- 按鼓类分立的脉冲包络 ----------
   从实测起始点(onT/onA)和 k-means 类别(cls)合成三条指数衰减包络。
   时间常数按类分开是量出来的差别：kick 稀而重、余响长；hat 密而弱、几乎不余。
   三条包络分别作用于三类团块，所以"音色的脉冲性质"是可分立的，不是整体一闪。 */
const CLS_N=3, TAU_C=[0.26,0.14,0.065];       // kick / snare / hat 的余响秒数
const SWELL_C=[0.24,0.13,0.065];              // 每类的半径外扩：kick 是推，hat 只是颤
let PULS=null;
function buildPulse(){
  const fps=30, n=Math.ceil(CURVES.rms.length*0.5*fps)+8;   // 覆盖整曲 + 余响尾巴
  PULS=[0,1,2].map(()=>new Float32Array(n));
  for(let i=0;i<STEMS.onT.length;i++){
    const t=STEMS.onT[i]*ONSET_GAP, a=STEMS.onA[i]/100, c=STEMS.cls[i];
    if(!(a>0.02)) continue;
    const tau=TAU_C[c], st=Math.ceil(tau*fps*4);
    const s=Math.floor(t*fps);
    for(let k=0;k<st;k++){
      const o=s+k; if(o>=n) break;
      PULS[c][o]+=a*Math.exp(-k/(fps*tau));
    }
  }
  // 归一到 99 分位：拿固定 1.0 当满度会饱和（上一版就是这么糊成一片的）
  for(let c=0;c<CLS_N;c++){
    const sorted=Float32Array.from(PULS[c]).sort();
    const pk=sorted[Math.floor((n-1)*0.99)]||1;
    for(let i=0;i<n;i++) PULS[c][i]=cl(PULS[c][i]/pk,0,1.6);
  }
}
const pulsAt=(c,t)=>{const f=t*30,i=f|0,u=f-i;
  if(!PULS||i>=PULS[c].length-1) return 0;
  return PULS[c][i]+(PULS[c][i+1]-PULS[c][i])*u;};

/* ---------- 团块：世界坐标，与视口无关 ---------- */
const NB=240;
const blobs=[];
function mulberry(seed){return()=>{seed=(seed+0x6D2B79F5)|0;
  let t=Math.imul(seed^(seed>>>15),1|seed);
  t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function buildBlobs(){
  const R=mulberry(20261006);                      // 播种：换机/重开都是同一片云
  blobs.length=0;
  for(let i=0;i<NB;i++){
    // 频段 b：0=顶(高频) 1=底(低频)。分布偏底——低频才堆得起来
    const b=Math.pow(R(),0.72);
    const y=VOL.yHi - b*(VOL.yHi-VOL.yLo);
    const z=VOL.zNear + Math.pow(R(),0.8)*(VOL.zFar-VOL.zNear);
    // 低频团块大而实，高频团块小而丝
    const r=(0.10+0.34*b)*(0.60+0.85*R());
    const c = b>0.66 ? 0 : (b>0.33 ? 1 : 2);        // 频段决定归属哪类鼓
    blobs.push({b,y,z,r,c,
      x:(R()*2-1)*VOL.hx*(0.35+0.65*(1-b*0.3)),
      sig:(0.40+0.52*R())*(0.45+0.85*b),
      sq:R()*400, sw:0.25+0.75*R(), ph:R()*6.283});
  }
}

    const X=B.x*cy + B.z*sy, Z=-B.x*sy + B.z*cy;
    s.ok=0;
    if(Z<VOL.zNear*0.55) continue;
    const inv=1/Z, sxp=hx+focal*X*inv, syp=hy-focal*(B.y-camY)*inv;
    const Rp=focal*B.r*inv;
    if(Rp<0.6 || sxp+Rp<0 || sxp-Rp>W || syp+Rp<0 || syp-Rp>H) continue;
    const e=bandAt(B.b);
    const near=cl(VOL.zRef*inv,0.30,1.75);
    // 深度延迟：远处的团块晚一点点响应。鼓点因此像一波扫过体积，
    // 而不是全场同时闪一下——这个"抖"只有真 3D 才给得出来。
    const p=pulsAt(B.c,tNow-(Z-VOL.zNear)*0.016);
    // 上升沿：只看冲量到来那几十毫秒。余响期交给形变（半径/轮廓），不再点亮
    const pd=Math.max(0,(p-pulsAt(B.c,tNow-(Z-VOL.zNear)*0.016-0.05)))*9.0;
    // 呼吸=团块自身缓慢起伏；脉冲=该类鼓点一响就额外鼓胀变亮
    const wob=0.80+0.36*fbm(B.sq,B.sq*0.7-phase*0.35,3.0);
    const amp=B.sig*wob*(0.26+1.45*e)*near*(1+SWELL_C[B.c]*p*3.2);
    if(amp<0.004) continue;
    s.ok=1; s.z=Z; s.x=sxp; s.y=syp; s.R=Rp*(1+SWELL_C[B.c]*p); s.pw=p; s.pd=pd;
    s.amp=amp; s.sw=B.sw; s.sq=B.sq; s.c=B.c;
    ORD2.push(i);
  }
  ORD2.sort((a,b)=>SC[a].z-SC[b].z);
  for(let li=0;li<ORD2.length;li++){
    const s=SC[ORD2[li]];
    const RR=s.R, invR2=1/(RR*RR);
    const c0=Math.max(0,Math.floor((s.x-RR)*invPW)), c1=Math.min(COLS-1,Math.ceil((s.x+RR)*invPW));
    const r0=Math.max(0,Math.floor((s.y-RR)*invCH));
    // 云底是**世界里的水平面**，不是屏幕上的横线：同一深度才共用一条底边，
    // 所以按该团块自己的 Z 求底边行来裁盘。不裁的话圆盘下半截垂到底面以下，
    // 照样把雨区糊满。
    const baseYpx=hy+focal*(camY-VOL.yLo)/s.z;
    const r1=Math.min(ROWS-1,Math.ceil((baseYpx+cellH)*invCH)-1);
    if(r1<r0) continue;
    const tScale=(T*0.5)/(RR*(0.55+0.9*s.sw));
    // 低频那一路负责"形状"：把截止半径揉皱，边缘才不是圆。
    // 只留高频那一路的话，轮廓是解析圆，一眼就看出是贴图。
    const cScale=(T*0.5)/(RR*0.95);
    const ox=(s.sq*7.3)%T, oy=(s.sq*3.7)%T;
    for(let r=r0;r<=r1;r++){
      const dyp=(r+0.5)*cellH-s.y, row=r*COLS;
      for(let c=c0;c<=c1;c++){
        const dxp=(c+0.5)*PXW-s.x, q2=(dxp*dxp+dyp*dyp)*invR2;
        if(q2>=1.35) continue;
        const ci=((ox+dxp*cScale)|0)&(T-1), cj=((oy+dyp*cScale)|0)&(T-1);
        // 揉皱幅度要够大才会"咬出缺口"。0.42 只是让圆周起伏几个百分点，
        // 整体仍是一个解析圆——一眼看出是贴图。0.95 才把轮廓打成不规则团。
        let pr=1-q2-(0.95+1.05*s.pw)*(TILE[cj*T+ci]-0.44);   // 揉皱幅度随脉冲加大
        if(pr<=0) continue;
        pr=pr*pr;                       // 二次而非三次：三次方把实核缩成一个点，云就没有身体
        const und=(dyp+RR-(baseYpx-s.y))/cellH;   // 越过底面多少行
        if(und>0){ pr*=cl(1-und*0.8,0,1); if(pr<=0) continue }   // 越过底面的部分淡出，不留硬线
        const ti=((ox+dxp*tScale)|0)&(T-1), tj=((oy+dyp*tScale)|0)&(T-1);
        const d=s.amp*pr*(0.30+0.94*TILE[tj*T+ti]);
        const o=row+c, vis=Math.exp(-TAU[o]), add=d*vis;
        LUM[o]+=add; TAU[o]+=d;
        ZS[o]+=add*s.z; WS[o]+=add;
        if(add>DOMV[o]){ DOMV[o]=add; DOMC[o]=s.c }
        // "可见"要按类归一：hat 类按设计就是又小又薄（高频拉丝），实测单个
        // 起始幅度也最低。用绝对门槛 0.22 会把整类卡死（实测只亮 97 格）。
        const atk=s.pd*cl(add/(s.amp*0.30),0,1);
        if(atk>DOMP[o]) DOMP[o]=atk;
      }
    }
  }
}

/* ---------- 光栅化：密度→字符，深度→明暗 ----------
   字符厚度只能表达"这里有多少云"，表达不了"这块云有多近"——而近处更亮是体积感
   的主要线索之一。逐格设 alpha 做不到（一行一次 fillText），改成按视空间深度分
   三档各自成串、各自一个 alpha，从远到近叠上去。三档而不是更多：每档每行多一次
   fillText，开销线性涨，实测两档到三档收益明显、再往上就看不出差别。 */
function rasterize(){
  const base=(0.30+level*0.16+sharpSlow*0.10);
  for(let r=0;r<ROWS;r++){
    const ypx=(r+0.5)*cellH, vert=cl(ypx/cv.height,0,1);
    // 越接近画面底部越暗：云底是阴影面
    const shade=base*(0.55+0.45*(1-Math.pow(vert,1.4)*0.7));
    const row=r*COLS;
    let s0="",s1="",s2="",sf="",n0=false,n1=false,n2=false,nF=false;
    for(let c=0;c<COLS;c++){
      const v=LUM[row+c];
      if(v<0.030){s0+=" ";s1+=" ";s2+=" ";sf+=" ";continue}
      const zz=WS[row+c]>1e-6?ZS[row+c]/WS[row+c]:VOL.zFar;
      /* 阶梯常数是按实测分位反解的，不是试出来的：在 40/110/150/180/205s 五个时刻
         采了 19692 个亮格的 LUM 分布（p25=0.259 p50=0.517 p80=0.882），解
         idx=7(v/V)^K 使 p25->2、p50->4、p80->6，得 V=1.081 K=0.760。
         之前两版都错在这里：指数式把主体压到薄字符端（█ 只有 1 格用，"完全没云"），
         换幂 0.62 又冲过头（█ 成最大档，厚段 60%，会变回灰板）。
         现在只有最密的前 5% 顶到 █——云该是中调纹理加一小块实心核。 */
      let idx=Math.round(7*Math.pow(cl(v/1.081,0,1),0.760) + bandAt(vert)*1.15 + (zz<7.5?0.7:(zz<11?0.25:-0.35)));
      if(idx>7)idx=7; if(idx<0)idx=0;
      const ch=THICK.charAt(idx);
      if(zz<7.5){ s2+=ch; n2=true; s0+=" "; s1+=" " }
      else if(zz<11){ s1+=ch; n1=true; s0+=" "; s2+=" " }
      else { s0+=ch; n0=true; s1+=" "; s2+=" " }
      // 脉冲通道：主导鼓类正在响的格子，字符往上顶两档单独再画一遍
      const pw=DOMP[row+c];
      if(pw>0.30){ sf+=THICK.charAt(Math.min(6,idx+1)); nF=true } else sf+=" ";
    }
    if(n0){ cx.fillStyle=`rgba(150,157,170,${cl(shade*0.62,0.06,0.9).toFixed(3)})`; cx.fillText(s0,0,ypx) }
    if(n1){ cx.fillStyle=`rgba(176,182,193,${cl(shade*0.86,0.08,0.92).toFixed(3)})`; cx.fillText(s1,0,ypx) }
    if(n2){ cx.fillStyle=`rgba(214,220,231,${cl(shade*0.98,0.10,0.80).toFixed(3)})`; cx.fillText(s2,0,ypx) }
    // 字符上限压在 6 不用 7：把 █ 留给密度真正堆满处，高亮层永远带缝
    if(nF){ cx.fillStyle=`rgba(246,240,226,${cl(shade*1.05,0.14,0.72).toFixed(3)})`; cx.fillText(sf,0,ypx) }
  }
}

/* ---------- 裂缝：低频被抽空的瞬间，云裂开泄出天光 ---------- */
function drawCrack(){
  if(crack<=0.30) return;
  for(let r=0;r<ROWS;r++){
    const ypx=(r+0.5)*cellH;
    let line="",any=false;
    for(let c=0;c<COLS;c++){
      const o=r*COLS+c, v=LUM[o];
      if(v<0.10){line+=" ";continue}
      const hole=fbm(c*0.055+11, r*0.10-phase*0.9, 23);
      const hd=hole-(0.62-crack*0.15);
      if(hd<=0){line+=" ";continue}
      const g=cl(hd*4.5,0,1);
      line+= g>0.72?"█":(g>0.48?"▓":(g>0.28?"*":(g>0.14?"=":"·")));
      any=true;
    }
    if(!any) continue;
    cx.fillStyle=`rgba(248,230,188,${(0.30+crack*0.34).toFixed(3)})`;
    cx.fillText(line,0,ypx);
  }
}

/* ---------- 雨：落在算出来的云底之下 ---------- */
const RAIN_MAX=560;
const rx=new Float32Array(RAIN_MAX), ry=new Float32Array(RAIN_MAX),
      rv=new Float32Array(RAIN_MAX), rl=new Uint8Array(RAIN_MAX);
let rainN=0, base=null;
const RAIN_CH=[["·","'","."],["'","`","|"],["|","/","\\"]];
const RAIN_OP=["0.20","0.34","0.50"];
let rainBuf=null;
function allocRain(){
  rainBuf=[0,1,2].map(()=>{const rows=[];
    for(let r=0;r<ROWS;r++) rows.push(new Array(COLS).fill(" "));
    return rows});
  base=new Float32Array(COLS);
}
/* 云底不再是配的一条线：从合成好的密度场里逐列扫出"最靠下的有云处"。
   雨因此落在云真的结束的地方。 */
function findBase(){
  if(!base) return;
  let all=0;
  for(let c=0;c<COLS;c++){
    let yb=ROWS*0.42;
    for(let r=ROWS-1;r>=0;r--){
      if(LUM[r*COLS+c]>0.16){yb=r+1;break}
    }
    base[c]=cl(yb/ROWS,0.20,0.96); all+=base[c];
  }
  baseMean=all/COLS;
}
let baseMean=0.5;
function windAt(t){ return Math.sin(t*0.115)*0.55+Math.sin(t*0.037+1.7)*0.45 }
const RAIN_PAD=0.18;
function rainX(){ return (Math.random()*(1+2*RAIN_PAD)-RAIN_PAD)*cv.width }
function baseAtPx(px){ return base[cl((px/PXW)|0,0,COLS-1)] }
function updateRain(dt){
  if(!base) return;
  const want=Math.min(RAIN_MAX, Math.floor((40+level*360)*(1+2*RAIN_PAD)));
  while(rainN<want){
    const px=rainX(), cb=baseAtPx(px);
    rx[rainN]=px; rv[rainN]=Math.random(); rl[rainN]=0;
    ry[rainN]=cb*cv.height + Math.random()*(1-cb)*cv.height*0.45;
    rainN++;
  }
  if(want<rainN) rainN=want;
  const fall=cv.height*1.41, wind=windAt(tNow);
  const XLO=-RAIN_PAD*cv.width-20, XHI=(1+RAIN_PAD)*cv.width+20;
  for(let i=0;i<rainN;i++){
    const spd=0.55+rv[i]*0.55;                      // 恒定基准，个体只差一点点
    ry[i]+= spd*fall*dt;
    rx[i]+= wind*spd*fall*0.11*dt;
    if(ry[i]>cv.height+20||rx[i]<XLO||rx[i]>XHI){
      const px=rainX(), cb=baseAtPx(px);
      rx[i]=px; ry[i]=cb*cv.height+Math.random()*8; rv[i]=Math.random();
    }
  }
}
function drawRain(){
  if(!rainN||!rainBuf) return;
  for(let g=0;g<3;g++){const rows=rainBuf[g];
    for(let r=0;r<ROWS;r++) rows[r].fill(" ")}
  const wind=windAt(tNow), slant=Math.abs(wind);
  for(let i=0;i<rainN;i++){
    const c=(rx[i]/PXW)|0, r=(ry[i]/cellH)|0;
    if(c<0||c>=COLS||r<0||r>=ROWS) continue;
    const inCloud = ry[i] < base[c]*cv.height;
    if(inCloud && rv[i]>0.42) continue;              // 云内的雨走最细档：读作雨幕
    const g=inCloud?0:(rv[i]>0.66?2:(rv[i]>0.33?1:0));
    const set=RAIN_CH[g]; let ch;
    if(g===0) ch = slant>0.55?".":"'";
    else if(g===1) ch = slant>0.62?(wind>0?"/":"\\"):"`";
    else ch = slant>0.80?(wind>0?"/":"\\"):"|";
    rainBuf[g][r][c]=ch;
    if(tMask && tMask[r*COLS+c]) tHit[r*COLS+c]+=1;
    if(g===2 && r>0 && rainBuf[2][r-1][c]===" ") rainBuf[2][r-1][c]="'";
  }
  for(let g=0;g<3;g++){
    cx.fillStyle=`rgba(${g===2?"206,212,222":(g===1?"178,185,197":"150,157,170")},${RAIN_OP[g]})`;
    const rows=rainBuf[g];
    for(let r=0;r<ROWS;r++) cx.fillText(rows[r].join(""),0,(r+0.5)*cellH);
  }
}

/* ---------- 标题 ---------- */
const FONT={
  G:[14,17,16,23,17,17,14], R:[30,17,17,30,20,18,17], E:[31,16,16,30,16,16,31],
  Y:[17,17,10,4,4,4,4],     C:[14,17,16,16,16,17,14], L:[16,16,16,16,16,16,31],
  O:[14,17,17,17,17,17,14], U:[17,17,17,17,17,17,14], D:[30,17,17,17,17,17,30],
  " ":[0,0,0,0,0,0,0]
};
const WORD="GREY CLOUD";
let tMask=null,tRows=[],tSX=2,tSY=2,tHit=null;
function buildTitle(){
  if(!COLS) return;
  const per=6, one=WORD, two=WORD.split(" ");
  const u1=one.length*per-1, u2=Math.max(...two.map(w=>w.length*per-1));
  const targetW=Math.floor(COLS*0.86);
  const lines = Math.floor(targetW/u1)>=2 ? [one] : two;
  const units=Math.max(...lines.map(w=>w.length*per-1));
  tSX=cl(Math.floor(targetW/units),1,6);
  tSY=cl(Math.floor(ROWS*0.26/(lines.length*7+(lines.length-1)*0.5)),1,4);
  const lineH=7*tSY, gap=Math.max(1,Math.round(tSY*0.5));
  const h=lines.length*lineH+(lines.length-1)*gap;
  const ref=0.60;
  let top=Math.floor(ref*ROWS+(ROWS-ref*ROWS-h)*0.34);
  top=cl(top,0,ROWS-h-1);
  tMask=new Uint8Array(COLS*ROWS); tHit=new Float32Array(COLS*ROWS); tRows=[];
  for(let r=0;r<h;r++) tRows.push(top+r);
  let oy=top;
  for(const ln of lines){
    let ox=Math.floor((COLS-(ln.length*per-1)*tSX)/2);
    for(const ch of ln){
      const bm=FONT[ch]||FONT[" "];
      for(let gy=0;gy<7;gy++)for(let gx=0;gx<5;gx++){
        if(!((bm[gy]>>(4-gx))&1)) continue;
        for(let sy=0;sy<tSY;sy++)for(let sx=0;sx<tSX;sx++){
          const rr=oy+gy*tSY+sy, cc=ox+gx*tSX+sx;
          if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS) tMask[rr*COLS+cc]=1;
        }
      }
      ox+=per*tSX;
    }
    oy+=lineH+gap;
  }
}
function drawTitle(){
  if(!tMask) return;
  const pulse=0.55+0.45*Math.sin(tNow*0.23);
  for(const r of tRows){
    let bs="",lit="",nB=false,nL=false;
    const ypx=(r+0.5)*cellH;
    for(let c=0;c<COLS;c++){
      const i=r*COLS+c;
      if(!tMask[i]){bs+=" ";lit+=" ";continue}
      const hh=tHit[i]; tHit[i]=hh*0.90;
      bs+="░"; nB=true;
      if(hh>0.30){ lit+= hh>1.7?"▓":(hh>0.85?"#":"*"); nL=true } else lit+=" ";
    }
    if(nB){ cx.fillStyle=`rgba(214,222,236,${(0.28+0.13*pulse).toFixed(3)})`; cx.fillText(bs,0,ypx) }
    if(nL){ cx.fillStyle=`rgba(238,244,252,${(0.54+0.26*pulse).toFixed(3)})`; cx.fillText(lit,0,ypx) }
  }
}

/* ---------- 闪电：鼓点=云内放电，仍是字符 ---------- */
const bolts=[];
let oi=0, prevT=0;
function boltPts(x0,y0,x1,y1,disp,levels){
  let p=[[x0,y0],[x1,y1]];
  for(let l=0;l<levels;l++){
    const out=[];
    for(let i=0;i<p.length-1;i++){
      const a=p[i],b=p[i+1];
      const dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy)||1;
      const off=(Math.random()*2-1)*disp/(l*0.9+1);
      out.push(a,[(a[0]+b[0])/2-dy/len*off,(a[1]+b[1])/2+dx/len*off]);
    }
    out.push(p[p.length-1]); p=out;
  }
  return p;
}
function spawnBolt(c,a){
  const W=cv.width,H=cv.height, r=Math.random;
  const yTop=baseMean*H*0.55;
  let x0=r()*W, y0=yTop+r()*H*0.18;
  let width,life,brN,disp,len;
  if(c===0){width=2.4;life=0.34+r()*0.20;brN=1;disp=0.055;len=H*0.42}      // kick：长、直、粗
  else if(c===1){width=1.7;life=0.20+r()*0.14;brN=2+((r()*2)|0);disp=0.10;len=H*0.28}
  else {width=1.0;life=0.09+r()*0.08;brN=0;disp=0.16;len=H*0.11}           // hat：短小火花
  const x1=x0+(r()-0.5)*W*0.18, y1=y0+len*(0.7+r()*0.6);
  const pts=boltPts(x0,y0,x1,y1,disp*len,4);
  const br=[];
  for(let k=0;k<brN;k++){
    const i=1+((r()*(pts.length-2))|0), p=pts[i];
    br.push(boltPts(p[0],p[1],p[0]+(r()-0.5)*W*0.12,p[1]+len*(0.2+r()*0.3),disp*len*0.8,3));
  }
  let mxs=0,mys=0; for(const q of pts){mxs+=q[0];mys+=q[1]} mxs/=pts.length; mys/=pts.length;
  bolts.push({t:tNow,pts,br,width,life,cx:mxs,cy:mys,amp:a});
}
function pumpOnsets(t){
  if(t<prevT-0.25){oi=0; bolts.length=0}
  prevT=t;
  while(oi<STEMS.onT.length && STEMS.onT[oi]*ONSET_GAP<=t){
    const a=STEMS.onA[oi]/100, c=STEMS.cls[oi];
    if(a>[0.10,0.16,0.22][c]) spawnBolt(c,a);
    oi++;
  }
}
const BCH=["|","/","\\","-"], GCH=["*","+","·"];
function boltCharAt(pts,i){
  const a=pts[Math.max(0,i-1)], b=pts[Math.min(pts.length-1,i+1)];
  const dx=b[0]-a[0], dy=b[1]-a[1];
  if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5) return 0;
  if(Math.abs(dx)<Math.abs(dy)*0.6) return 0;
  const s=dy/dx;
  if(s>0.6) return 1; if(s<-0.6) return 2; return 3;
}
let BW=0,BCORE=null,BGLOW=null,BVIS=new Uint8Array(ROWS),BROWS=[];
function drawBolts(t){
  if(!bolts.length) return;
  if(!BCORE||BW!==COLS+10){ BW=COLS+10; BCORE=new Uint8Array(BW*ROWS); BGLOW=new Uint8Array(BW*ROWS) }
  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i], age=t-b.t;
    // age<0 也要丢：驱动把时间拨回去时，先前生成的闪电会变成"未来的"，
    // 只判 age>life 的话它们永远不过期（实测攒下 354 条，画面糊满金色碎点）
    if(age>b.life || age<0){ bolts.splice(i,1); continue }
    const k=1-age/b.life, grow=age/b.life;
    const flick=0.5+0.5*Math.abs(Math.sin(age*44+i*2.3));
    const al=Math.pow(k,1.3)*flick;
    // 余辉外扩：半径随寿命从 1 格长到 3 格，字符同时从 * 退到 ·
    const rad=grow<0.28?1:(grow<0.60?2:3), gidx=grow<0.28?0:(grow<0.60?1:2);
    BCORE.fill(0); BGLOW.fill(0); BVIS.fill(0); BROWS.length=0;
    const step=Math.min(PXW,cellH)*0.85;
    for(const one of [b.pts,...b.br]){
      for(let s=0;s+1<one.length;s++){
        const x0=one[s][0],y0=one[s][1],x1=one[s+1][0],y1=one[s+1][1];
        const n=Math.max(1,Math.ceil(Math.hypot(x1-x0,y1-y0)/step));
        const ch=boltCharAt(one,s);
        for(let q=0;q<n;q++){
          const c=Math.floor((x0+(x1-x0)*q/n)/PXW)+5, r=Math.floor((y0+(y1-y0)*q/n)/cellH);
          if(r<0||r>=ROWS||c<1||c>=BW-1) continue;
          BCORE[r*BW+c]=ch+1;
          for(let dy=-rad;dy<=rad;dy++){
            const rr=r+dy; if(rr<0||rr>=ROWS) continue;
            for(let dx=-rad;dx<=rad;dx++){
              const cc=c+dx; if(cc<0||cc>=BW) continue;
              const d=Math.max(Math.abs(dx),Math.abs(dy));
              if(d===0) continue;
              BGLOW[rr*BW+cc]=gidx+1;
            }
          }
          if(!BVIS[r]){BVIS[r]=1;BROWS.push(r)}
        }
      }
    }
    const hot=`rgba(232,242,255,${(al*0.95).toFixed(3)})`;
    const halo=`rgba(250,222,156,${(al*0.32*(1.15-grow*0.5)).toFixed(3)})`;
    for(const r of BROWS){
      const off=r*BW; let cs="",gs="",anyC=false,anyG=false;
      for(let c=0;c<BW;c++){
        const v=BCORE[off+c], w2=BGLOW[off+c];
        cs+= v?BCH[v-1]:" ";
        if(w2){gs+=GCH[w2-1];anyG=true} else gs+=" ";
        if(v) anyC=true;
      }
      const ypx=(r+0.5)*cellH;
      cx.fillStyle=halo;
      if(anyG) cx.fillText(gs,-5*PXW,ypx);
      if(anyC){ cx.fillStyle=hot; cx.fillText(cs,-5*PXW,ypx) }
      BCORE.fill(0,off,off+BW); BGLOW.fill(0,off,off+BW);
    }
  }
}

/* ---------- 帧 ---------- */
let last=performance.now(), audio=null;
function frame(now){
  const dt=Math.min(0.08,(now-last)/1000); last=now;
  if(audio && !audio.paused && isFinite(audio.currentTime)) tNow=audio.currentTime;
  else tNow+=dt;
  sx += (mx-sx)*0.055;
  // 无输入时自己缓摆：不然录屏里根本没有视差，体积感无从体现
  const idle=Math.sin(tNow*0.062)*0.55+Math.sin(tNow*0.027+1.1)*0.45;
  yaw = sx*0.135 + (Math.abs(mx)<0.02 ? idle*0.045 : 0);
  phase += dt*(0.05+level*0.07+0.10);
  analyse(tNow);
  pumpOnsets(tNow);
  if(needAlloc){ alloc(); allocRain(); rainN=0; needAlloc=false }
  findBase(); updateRain(dt); compose();

  cx.fillStyle=`rgba(7,8,10,${0.34+dying*0.22})`;
  cx.fillRect(0,0,cv.width,cv.height);
  rasterize();
  drawCrack();
  drawRain();
  drawTitle();
  drawBolts(tNow);
  requestAnimationFrame(frame);
}

/* ---------- 启动 ---------- */
buildTile(); buildPulse(); buildBlobs(); buildScratch(); resize(); alloc(); allocRain();
if(DEMO) document.getElementById("start").classList.add("hide");   // 逐时刻验收/录屏用
// ?demo=1&t=150 直接起跳时，先把鼓点游标推到 tNow 之后：否则 while 循环会把
// 150 秒里所有鼓点一次性放出来，开局糊几百条闪电（实测 bolts=474）
while(oi<STEMS.onT.length && STEMS.onT[oi]*ONSET_GAP<=tNow) oi++;
prevT=tNow;
requestAnimationFrame(frame);
document.getElementById("start").addEventListener("click",async function(){
  this.classList.add("hide");
  audio=document.getElementById("a");
  try{ await audio.play() }catch(e){ audio=null }
});
</script>
